name: 打包 Windows .exe 安装包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许创建 GitHub Release

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ffmpeg
        run: choco install ffmpeg -y
        shell: cmd

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn openai-whisper deep-translator pyinstaller
        shell: cmd

      - name: 下载 Whisper base 模型（内置到安装包，用户无需联网）
        run: python -c "import whisper; whisper.load_model('base')"
        shell: cmd

      - name: 安装根目录 Node 依赖
        run: npm install
        shell: cmd

      - name: 安装前端 Node 依赖
        run: npm install
        working-directory: frontend
        shell: cmd

      - name: 构建前端
        run: npm run build
        working-directory: frontend
        shell: cmd

      - name: 获取 ffmpeg.exe 路径并复制到 backend/ffmpeg/
        shell: cmd
        run: |
          for /f "delims=" %%i in ('where ffmpeg') do set FFMPEG_EXE=%%i
          echo ffmpeg found at: %FFMPEG_EXE%
          if not exist backend\ffmpeg mkdir backend\ffmpeg
          copy "%FFMPEG_EXE%" backend\ffmpeg\ffmpeg.exe

      - name: PyInstaller 打包后端（含 base.pt 模型 + ffmpeg）
        working-directory: backend
        shell: cmd
        run: |
          for /f "delims=" %%i in ('python -c "import whisper, os; print(os.path.dirname(whisper.__file__))"') do set WHISPER_PATH=%%i
          echo Whisper path: %WHISPER_PATH%
          for /f "delims=" %%j in ('python -c "import os; print(os.path.join(os.path.expanduser('~'), '.cache', 'whisper', 'base.pt'))"') do set MODEL_PATH=%%j
          echo Model path: %MODEL_PATH%
          python -m PyInstaller --onefile --name subtitle_backend --distpath ..\backend-dist --workpath ..\build\pyinstaller --specpath ..\build --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on --hidden-import fastapi --hidden-import whisper --hidden-import tiktoken --hidden-import tiktoken_ext --hidden-import tiktoken_ext.openai_public --add-data "%WHISPER_PATH%;whisper" --add-data "%MODEL_PATH%;whisper_models" --add-data "ffmpeg\ffmpeg.exe;ffmpeg" --noconfirm run.py

      - name: 验证后端产物
        shell: cmd
        run: dir backend-dist\

      - name: 打包 Windows 安装包
        run: npx electron-builder --win --x64 --publish never
        shell: cmd
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_CACHE: C:\electron-builder-cache
          # 使用国内镜像加速下载
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 列出打包产物
        shell: cmd
        run: dir dist-electron\

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-studio-windows
          path: dist-electron/*.exe
          retention-days: 30

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
          name: Subtitle Studio ${{ github.ref_name }}
          body: |
            ## Subtitle Studio ${{ github.ref_name }}
            - **Windows**: 下载 `Subtitle Studio Setup *.exe`，双击安装即可
            - Whisper 模型已内置，**完全离线可用**，无需联网下载
            - 无需安装 Python / Node.js / ffmpeg
