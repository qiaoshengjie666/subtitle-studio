name: 打包 Windows .exe 安装包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ffmpeg
        run: choco install ffmpeg -y
        shell: powershell

      - name: 安装 Python 依赖
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn "python-multipart" openai-whisper deep-translator pyinstaller

      - name: 下载 Whisper base 模型
        shell: powershell
        run: python -c "import whisper; whisper.load_model('base')"

      - name: 安装根目录 Node 依赖
        shell: powershell
        run: npm install

      - name: 安装前端 Node 依赖
        working-directory: frontend
        shell: powershell
        run: npm install

      - name: 构建前端
        working-directory: frontend
        shell: powershell
        run: npm run build

      - name: 复制 ffmpeg.exe 到 backend/ffmpeg/
        shell: powershell
        run: |
          $ffmpegExe = (Get-Command ffmpeg).Source
          Write-Host "ffmpeg found at: $ffmpegExe"
          New-Item -ItemType Directory -Force -Path "backend\ffmpeg" | Out-Null
          Copy-Item $ffmpegExe "backend\ffmpeg\ffmpeg.exe"
          Write-Host "ffmpeg copied successfully"

      - name: PyInstaller 打包后端
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          Write-Host "Root: $root"

          $modelPath = python -c "import os; print(os.path.join(os.path.expanduser('~'), '.cache', 'whisper', 'base.pt'))"
          Write-Host "Model path: $modelPath"

          if (-not (Test-Path $modelPath)) {
            Write-Error "base.pt not found at $modelPath"
            exit 1
          }

          $ffmpegExe = "$root\backend\ffmpeg\ffmpeg.exe"
          Write-Host "ffmpeg exe: $ffmpegExe"
          if (-not (Test-Path $ffmpegExe)) {
            Write-Error "ffmpeg.exe not found at $ffmpegExe"
            exit 1
          }

          $runPy     = "$root\backend\run.py"
          $distPath  = "$root\backend-dist"
          $workPath  = "$root\build\pyinstaller"
          $specPath  = "$root\build"

          python -m PyInstaller `
            --onefile `
            --name subtitle_backend `
            --distpath "$distPath" `
            --workpath "$workPath" `
            --specpath "$specPath" `
            --hidden-import multipart `
            --collect-all multipart `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import fastapi `
            --hidden-import whisper `
            --hidden-import tiktoken `
            --hidden-import tiktoken_ext `
            --hidden-import tiktoken_ext.openai_public `
            --collect-all whisper `
            --collect-all tiktoken `
            --add-data "${modelPath};whisper_models" `
            --add-data "${ffmpegExe};ffmpeg" `
            --noconfirm `
            "$runPy"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "PyInstaller failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "PyInstaller completed successfully"

      - name: 验证后端产物
        shell: powershell
        run: |
          Get-ChildItem backend-dist\
          if (-not (Test-Path "backend-dist\subtitle_backend.exe")) {
            Write-Error "subtitle_backend.exe not found!"
            exit 1
          }
          Write-Host "Backend binary verified OK"

      - name: 打包 Windows 安装包
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_CACHE: C:\electron-builder-cache
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --win --x64 --publish never

      - name: 验证安装包产物
        shell: powershell
        run: |
          Get-ChildItem dist-electron\
          $exeFiles = Get-ChildItem dist-electron\ -Filter "*.exe"
          if ($exeFiles.Count -eq 0) {
            Write-Error "No .exe found in dist-electron!"
            exit 1
          }
          Write-Host "Found: $($exeFiles.Name)"

      - name: 上传安装包 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-studio-windows
          path: dist-electron/*.exe
          retention-days: 30

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
          name: Subtitle Studio ${{ github.ref_name }}
          body: |
            ## Subtitle Studio ${{ github.ref_name }}
            - **Windows**: 下载 `Subtitle Studio Setup *.exe`，双击安装即可
            - Whisper 模型已内置，**完全离线可用**，无需联网下载
            - 无需安装 Python / Node.js / ffmpeg
